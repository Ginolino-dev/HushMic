name: Release macOS App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish MicMinder
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build app bundle
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          swift test

          APP_VERSION="$VERSION" \
            APP_BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            BUILD_CONFIGURATION=release \
            ./scripts/build_and_run.sh --package

      - name: Verify app signature
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=4 dist/MicMinder.app

      - name: Archive app bundle
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ARCH="$(uname -m)"
          ZIP_PATH="dist/MicMinder-${VERSION}-macOS-${ARCH}.zip"

          rm -f "$ZIP_PATH"
          ditto -c -k --keepParent dist/MicMinder.app "$ZIP_PATH"
          (cd dist && shasum -a 256 "$(basename "$ZIP_PATH")" > "$(basename "$ZIP_PATH").sha256")
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ASSET_LABEL="MicMinder ${VERSION} for macOS"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_PATH#$ASSET_LABEL" "$ZIP_PATH.sha256" --clobber
          else
            gh release create "$TAG" "$ZIP_PATH#$ASSET_LABEL" "$ZIP_PATH.sha256" \
              --title "MicMinder ${VERSION}" \
              --draft \
              --generate-notes \
              --verify-tag
          fi
